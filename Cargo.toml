[package]
name = "rsashield"
version = "0.1.0"
edition = "2021"
description = "Offline, multi-signal RSA public-key quality auditor for authorised ICS/substation key reviews"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rsashield"
path = "src/main.rs"

[lib]
name = "rsashield"
path = "src/lib.rs"

[dependencies]
num-bigint = { version = "0.4.6", features = ["rand"] }
num-integer = "0.1.46"
num-traits = "0.2.19"
rand = "0.8.5"
rand_chacha = "0.3.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
base64 = "0.22.1"

[profile.release]
opt-level = 3
